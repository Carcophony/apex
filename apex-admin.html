<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APEX — Race Control</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #080909;
  --bg2: #0e0f11;
  --bg3: #13151a;
  --bg4: #1a1c21;
  --border: #222529;
  --gold: #f5c842;
  --gold2: #c9a84c;
  --red: #e8132a;
  --green: #22c55e;
  --amber: #f59e0b;
  --white: #ffffff;
  --ink: rgba(255,255,255,0.5);
  --ink2: rgba(255,255,255,0.25);
}

html, body {
  min-height: 100vh;
  background: var(--bg);
  color: var(--white);
  font-family: Impact, 'Arial Narrow', Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}

body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    repeating-linear-gradient(45deg,  rgba(255,255,255,0.012) 0, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 10px),
    repeating-linear-gradient(-45deg, rgba(255,255,255,0.012) 0, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 10px);
  pointer-events: none;
}

/* ── LOGIN SCREEN ── */
#login-screen {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  padding: 24px; z-index: 100;
  background: var(--bg);
}
.login-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  width: 100%; max-width: 360px;
  box-shadow: 0 0 0 1px rgba(245,200,66,0.1), 0 32px 80px rgba(0,0,0,0.9);
}
.login-header {
  background: var(--bg3);
  padding: 28px 24px 20px;
  border-bottom: 1px solid var(--border);
  position: relative;
}
.login-header::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 4px;
  background: linear-gradient(90deg, var(--red), #ff3d55, var(--red));
}
.login-logo { font-size: 32px; font-weight: 900; letter-spacing: 0.15em; color: var(--white); line-height: 1; }
.login-logo em { color: var(--red); font-style: normal; }
.login-sub { font-size: 9px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink2); margin-top: 4px; }
.login-body { padding: 24px; }
.field-label { font-size: 9px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink); margin-bottom: 6px; display: block; }
.field-input {
  width: 100%; padding: 12px 14px;
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 8px; color: var(--white);
  font-family: Impact, 'Arial Narrow', Arial, sans-serif;
  font-size: 18px; font-weight: 700; letter-spacing: 0.06em;
  outline: none; margin-bottom: 14px;
  transition: border-color 0.15s;
}
.field-input:focus { border-color: var(--red); }
.field-input[type="password"] { letter-spacing: 0.2em; }
.btn-primary {
  width: 100%; padding: 14px;
  background: var(--red); color: white; border: none;
  border-radius: 8px; cursor: pointer;
  font-family: Impact, 'Arial Narrow', Arial, sans-serif;
  font-size: 16px; font-weight: 900; letter-spacing: 0.1em;
  text-transform: uppercase; transition: background 0.15s;
}
.btn-primary:hover { background: #ff1f38; }
.btn-primary:active { transform: scale(0.98); }
.login-error { font-size: 11px; color: var(--red); text-align: center; margin-top: 10px; font-family: Arial, sans-serif; display: none; }

/* ── MAIN ADMIN UI ── */
#admin-ui { display: none; }

.site-header {
  background: var(--bg2);
  border-bottom: 3px solid var(--red);
  padding: 0 24px;
  display: flex; align-items: center; justify-content: space-between;
  height: 56px; position: relative; z-index: 10;
}
.logo { font-size: 22px; font-weight: 900; letter-spacing: 0.15em; color: var(--white); }
.logo em { color: var(--red); font-style: normal; }
.admin-badge {
  background: var(--red); color: white;
  font-size: 9px; font-weight: 700; letter-spacing: 0.18em;
  text-transform: uppercase; padding: 4px 10px; border-radius: 4px;
}

.main { max-width: 900px; margin: 0 auto; padding: 28px 24px 60px; }

/* ── SECTION ── */
.section { margin-bottom: 32px; }
.section-head {
  display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
}
.section-title {
  font-size: 11px; font-weight: 700; letter-spacing: 0.22em;
  text-transform: uppercase; color: var(--gold);
}
.section-rule { flex: 1; height: 1px; background: linear-gradient(90deg, rgba(245,200,66,0.2), transparent); }

/* ── RACE CARDS ── */
.race-list { display: flex; flex-direction: column; gap: 10px; }
.race-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 10px; overflow: hidden;
  transition: border-color 0.2s;
}
.race-card.live   { border-color: rgba(34,197,94,0.4); }
.race-card.scheduled { border-color: rgba(245,158,11,0.3); }
.race-card.closed { border-color: var(--border); opacity: 0.6; }

.race-card-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}
.race-card-name { font-size: 16px; font-weight: 900; letter-spacing: 0.04em; color: var(--white); }
.race-card-circuit { font-size: 10px; color: var(--ink); letter-spacing: 0.08em; margin-top: 2px; }
.status-pill {
  font-size: 9px; font-weight: 700; letter-spacing: 0.14em;
  text-transform: uppercase; padding: 4px 10px; border-radius: 20px;
}
.status-pill.live      { background: rgba(34,197,94,0.15);   color: var(--green); }
.status-pill.scheduled { background: rgba(245,158,11,0.15);  color: var(--amber); }
.status-pill.closed    { background: rgba(255,255,255,0.06); color: var(--ink2); }

.race-card-body { padding: 12px 16px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.race-meta { }
.meta-label { font-size: 8px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink2); margin-bottom: 3px; }
.meta-value { font-size: 13px; font-weight: 700; color: var(--white); letter-spacing: 0.04em; font-family: Arial, sans-serif; }

.race-card-footer {
  padding: 10px 16px; border-top: 1px solid var(--border);
  display: flex; gap: 8px;
}
.btn-sm {
  padding: 7px 14px; border-radius: 6px; border: none; cursor: pointer;
  font-family: Impact, 'Arial Narrow', Arial, sans-serif;
  font-size: 12px; font-weight: 900; letter-spacing: 0.08em;
  text-transform: uppercase; transition: all 0.15s;
}
.btn-sm.red    { background: var(--red); color: white; }
.btn-sm.red:hover { background: #ff1f38; }
.btn-sm.amber  { background: var(--amber); color: #000; }
.btn-sm.amber:hover { background: #fbbf24; }
.btn-sm.green  { background: var(--green); color: #000; }
.btn-sm.green:hover { background: #16a34a; }
.btn-sm.ghost  { background: var(--bg3); color: var(--ink); border: 1px solid var(--border); }
.btn-sm.ghost:hover { border-color: var(--red); color: var(--white); }

/* ── CREATE RACE FORM ── */
.create-form {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 10px; padding: 20px;
}
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
.form-field { display: flex; flex-direction: column; gap: 6px; }
.form-label { font-size: 9px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink); }
.form-input {
  padding: 10px 12px;
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 6px; color: var(--white);
  font-family: Arial, sans-serif; font-size: 13px;
  outline: none; transition: border-color 0.15s;
}
.form-input:focus { border-color: var(--gold2); }
.form-input[type="number"] { font-family: Impact, 'Arial Narrow', Arial, sans-serif; font-size: 16px; font-weight: 700; }
.form-select {
  padding: 10px 12px;
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 6px; color: var(--white);
  font-family: Arial, sans-serif; font-size: 13px;
  outline: none;
}

/* ── STATS ROW ── */
.stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 24px; }
.stat-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 8px; padding: 14px 16px;
}
.stat-n { font-size: 28px; font-weight: 900; color: var(--white); line-height: 1; }
.stat-n.gold { color: var(--gold); }
.stat-n.green { color: var(--green); }
.stat-n.red { color: var(--red); }
.stat-l { font-size: 8px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink2); margin-top: 4px; }

/* ── TOAST ── */
#toast {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--white); color: var(--bg);
  padding: 10px 20px; border-radius: 20px;
  font-size: 13px; font-weight: 700;
  opacity: 0; transition: opacity 0.2s, transform 0.2s;
  pointer-events: none; z-index: 200; white-space: nowrap;
  font-family: Arial, sans-serif;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.success { background: var(--green); color: #000; }

@media (max-width: 600px) {
  .form-grid { grid-template-columns: 1fr; }
  .stats-row { grid-template-columns: 1fr 1fr; }
  .race-card-body { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">AP<em>EX</em></div>
      <div class="login-sub">Race Control · Admin Access</div>
    </div>
    <div class="login-body">
      <label class="field-label">Password</label>
      <input class="field-input" type="password" id="pw-input" placeholder="••••••••" onkeydown="if(event.key==='Enter')checkPassword()" />
      <button class="btn-primary" onclick="checkPassword()">Enter Race Control</button>
      <div class="login-error" id="login-error">Incorrect password. Try again.</div>
    </div>
  </div>
</div>

<!-- ADMIN UI -->
<div id="admin-ui">

  <header class="site-header">
    <div class="logo">AP<em>EX</em></div>
    <div class="admin-badge">Race Control</div>
  </header>

  <div class="main">

    <!-- LIVE STATS -->
    <div class="stats-row" id="stats-row">
      <div class="stat-card"><div class="stat-n gold" id="stat-races">—</div><div class="stat-l">Races Scheduled</div></div>
      <div class="stat-card"><div class="stat-n green" id="stat-entries">—</div><div class="stat-l">Race Entries Today</div></div>
      <div class="stat-card"><div class="stat-n" id="stat-qualifiers">—</div><div class="stat-l">Qualifiers</div></div>
      <div class="stat-card"><div class="stat-n red" id="stat-players">—</div><div class="stat-l">Total Players</div></div>
    </div>

    <!-- CURRENT & UPCOMING RACES -->
    <div class="section">
      <div class="section-head">
        <div class="section-title">Race Calendar</div>
        <div class="section-rule"></div>
        <button class="btn-sm ghost" onclick="loadRaces()">↻ Refresh</button>
      </div>
      <div class="race-list" id="race-list">
        <div style="text-align:center;color:var(--ink2);padding:24px;font-family:Arial,sans-serif;font-size:13px;">Loading races...</div>
      </div>
    </div>

    <!-- CREATE NEW RACE -->
    <div class="section">
      <div class="section-head">
        <div class="section-title">Schedule New Race</div>
        <div class="section-rule"></div>
      </div>
      <div class="create-form">
        <div class="form-grid">
          <div class="form-field">
            <label class="form-label">Race Name</label>
            <input class="form-input" id="f-race-name" type="text" placeholder="British Grand Prix" />
          </div>
          <div class="form-field">
            <label class="form-label">Circuit</label>
            <input class="form-input" id="f-circuit" type="text" placeholder="Silverstone" />
          </div>
          <div class="form-field">
            <label class="form-label">Race Code (3 letters)</label>
            <input class="form-input" id="f-race-code" type="text" placeholder="BGP" maxlength="4" style="text-transform:uppercase;" />
          </div>
          <div class="form-field">
            <label class="form-label">Season</label>
            <input class="form-input" id="f-season" type="text" placeholder="2026 · S1" value="2026 · S1" />
          </div>
          <div class="form-field">
            <label class="form-label">Opens (your local time)</label>
            <input class="form-input" id="f-open" type="datetime-local" />
          </div>
          <div class="form-field">
            <label class="form-label">Closes (your local time)</label>
            <input class="form-input" id="f-close" type="datetime-local" />
          </div>
          <div class="form-field">
            <label class="form-label">Total Laps</label>
            <input class="form-input" id="f-laps" type="number" value="5" min="1" max="20" />
          </div>
          <div class="form-field">
            <label class="form-label">Questions per Lap</label>
            <input class="form-input" id="f-qpl" type="number" value="5" min="3" max="10" />
          </div>
          <div class="form-field">
            <label class="form-label">Penalty Seconds</label>
            <input class="form-input" id="f-penalty" type="number" value="10" min="0" max="60" />
          </div>
          <div class="form-field">
            <label class="form-label">Par Time (seconds per lap)</label>
            <input class="form-input" id="f-par" type="number" value="45" min="10" max="300" />
          </div>
        </div>
        <button class="btn-primary" onclick="createRace()">Schedule Race →</button>
      </div>
    </div>

  </div>
</div>

<div id="toast"></div>

<script>
const SUPABASE_URL = 'https://eluwjbndjlscixjytrzx.supabase.co';
const SUPABASE_KEY = 'sb_publishable_xOJRXt2dGCXovTNgDOSOJw_Shrbofuw';
const ADMIN_PASSWORD = 'APEX2026';  // Change this to whatever you want

// ── LOGIN ─────────────────────────────────────────────────────────────────────
function checkPassword() {
  const pw = document.getElementById('pw-input').value;
  if (pw === ADMIN_PASSWORD) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-ui').style.display = 'block';
    loadAll();
  } else {
    document.getElementById('login-error').style.display = 'block';
    document.getElementById('pw-input').value = '';
    document.getElementById('pw-input').focus();
  }
}

// ── LOAD EVERYTHING ───────────────────────────────────────────────────────────
async function loadAll() {
  await Promise.all([loadRaces(), loadStats()]);
}

// ── STATS ─────────────────────────────────────────────────────────────────────
async function loadStats() {
  try {
    const [racesRes, scoresRes, cardsRes] = await Promise.all([
      fetch(`${SUPABASE_URL}/rest/v1/apex_races?select=id`, { headers: headers() }),
      fetch(`${SUPABASE_URL}/rest/v1/apex_scores?select=handle`, { headers: headers() }),
      fetch(`${SUPABASE_URL}/rest/v1/apex_cards?card_type=eq.Qualifying&select=handle`, { headers: headers() }),
    ]);
    const races   = await racesRes.json();
    const scores  = await scoresRes.json();
    const quals   = await cardsRes.json();

    const uniquePlayers = new Set(scores.map(s => s.handle)).size;
    const uniqueQuals   = new Set(quals.map(q => q.handle)).size;

    document.getElementById('stat-races').textContent     = races.length;
    document.getElementById('stat-entries').textContent   = scores.length;
    document.getElementById('stat-qualifiers').textContent = uniqueQuals;
    document.getElementById('stat-players').textContent   = uniquePlayers;
  } catch(e) {}
}

// ── LOAD RACES ────────────────────────────────────────────────────────────────
async function loadRaces() {
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/apex_races?order=open_time.desc`,
      { headers: headers() }
    );
    const races = await res.json();
    renderRaces(races);
  } catch(e) {
    document.getElementById('race-list').innerHTML = '<div style="color:var(--red);padding:16px;font-family:Arial,sans-serif;">Failed to load races.</div>';
  }
}

function renderRaces(races) {
  const el = document.getElementById('race-list');
  if (!races.length) {
    el.innerHTML = '<div style="text-align:center;color:var(--ink2);padding:24px;font-family:Arial,sans-serif;font-size:13px;">No races scheduled yet. Create one below.</div>';
    return;
  }

  el.innerHTML = races.map(r => {
    const status = getRaceStatus(r);
    const open   = new Date(r.open_time);
    const close  = new Date(r.close_time);
    const fmt    = d => d.toLocaleString('en-GB', { weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });

    const statusButtons = status === 'live'
      ? `<button class="btn-sm amber" onclick="updateStatus(${r.id}, 'closed')">Close Race</button>`
      : status === 'scheduled'
      ? `<button class="btn-sm green" onclick="updateStatus(${r.id}, 'live')">Force Open</button>`
      : '';

    return `<div class="race-card ${status}">
      <div class="race-card-header">
        <div>
          <div class="race-card-name">${r.race_name}</div>
          <div class="race-card-circuit">${r.circuit} · ${r.season}</div>
        </div>
        <div class="status-pill ${status}">${status.toUpperCase()}</div>
      </div>
      <div class="race-card-body">
        <div class="race-meta">
          <div class="meta-label">Opens</div>
          <div class="meta-value">${fmt(open)}</div>
        </div>
        <div class="race-meta">
          <div class="meta-label">Closes</div>
          <div class="meta-value">${fmt(close)}</div>
        </div>
        <div class="race-meta">
          <div class="meta-label">Format</div>
          <div class="meta-value">${r.total_laps} laps · ${r.questions_per_lap}Q · ${r.penalty_secs}s pen</div>
        </div>
      </div>
      <div class="race-card-footer">
        ${statusButtons}
        <button class="btn-sm ghost" onclick="deleteRace(${r.id}, '${r.race_name}')">Delete</button>
      </div>
    </div>`;
  }).join('');
}

function getRaceStatus(race) {
  const now = new Date();
  const open  = new Date(race.open_time);
  const close = new Date(race.close_time);
  if (now < open)  return 'scheduled';
  if (now > close) return 'closed';
  return 'live';
}

// ── CREATE RACE ───────────────────────────────────────────────────────────────
async function createRace() {
  const raceName = document.getElementById('f-race-name').value.trim();
  const circuit  = document.getElementById('f-circuit').value.trim();
  const raceCode = document.getElementById('f-race-code').value.trim().toUpperCase();
  const season   = document.getElementById('f-season').value.trim();
  const openRaw  = document.getElementById('f-open').value;
  const closeRaw = document.getElementById('f-close').value;
  const laps     = parseInt(document.getElementById('f-laps').value);
  const qpl      = parseInt(document.getElementById('f-qpl').value);
  const penalty  = parseInt(document.getElementById('f-penalty').value);
  const par      = parseInt(document.getElementById('f-par').value);

  if (!raceName || !circuit || !raceCode || !openRaw || !closeRaw) {
    showToast('Fill in all required fields', false); return;
  }

  const openTime  = new Date(openRaw).toISOString();
  const closeTime = new Date(closeRaw).toISOString();

  if (new Date(closeTime) <= new Date(openTime)) {
    showToast('Close time must be after open time', false); return;
  }

  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/apex_races`, {
      method: 'POST',
      headers: { ...headers(), 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
      body: JSON.stringify({
        race_name: raceName, circuit, race_code: raceCode, season,
        open_time: openTime, close_time: closeTime,
        total_laps: laps, questions_per_lap: qpl,
        penalty_secs: penalty, par_time: par, status: 'scheduled'
      })
    });

    if (res.ok) {
      showToast('Race scheduled successfully!', true);
      clearForm();
      loadRaces();
      loadStats();
    } else {
      showToast('Failed to save — check Supabase', false);
    }
  } catch(e) { showToast('Connection error', false); }
}

// ── UPDATE STATUS ─────────────────────────────────────────────────────────────
async function updateStatus(id, status) {
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/apex_races?id=eq.${id}`, {
      method: 'PATCH',
      headers: { ...headers(), 'Content-Type': 'application/json' },
      body: JSON.stringify({ status })
    });
    showToast(`Race ${status}`, true);
    loadRaces();
  } catch(e) { showToast('Update failed', false); }
}

// ── DELETE RACE ───────────────────────────────────────────────────────────────
async function deleteRace(id, name) {
  if (!confirm(`Delete "${name}"? This cannot be undone.`)) return;
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/apex_races?id=eq.${id}`, {
      method: 'DELETE', headers: headers()
    });
    showToast('Race deleted', true);
    loadRaces();
    loadStats();
  } catch(e) { showToast('Delete failed', false); }
}

// ── UTILS ─────────────────────────────────────────────────────────────────────
function headers() {
  return { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` };
}

function clearForm() {
  ['f-race-name','f-circuit','f-race-code','f-open','f-close'].forEach(id => {
    document.getElementById(id).value = '';
  });
}

function showToast(msg, success = true) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show' + (success ? ' success' : '');
  setTimeout(() => t.className = '', 2500);
}

// Pre-fill open time to next hour, close time to 24h later
window.addEventListener('DOMContentLoaded', () => {
  const now = new Date();
  now.setMinutes(0, 0, 0);
  now.setHours(now.getHours() + 1);
  const later = new Date(now.getTime() + 24 * 60 * 60 * 1000);
  const fmt = d => d.toISOString().slice(0,16);
  document.getElementById('f-open').value  = fmt(now);
  document.getElementById('f-close').value = fmt(later);
  document.getElementById('pw-input').focus();
});
</script>
</body>
</html>
