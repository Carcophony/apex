<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APEX — Live Leaderboard</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #080909;
  --bg2: #0e0f11;
  --bg3: #13151a;
  --border: #222529;
  --gold: #f5c842;
  --gold2: #c9a84c;
  --gold3: #8a6d1e;
  --red: #e8132a;
  --green: #22c55e;
  --amber: #f59e0b;
  --silver: #aaaaaa;
  --bronze: #cd7f32;
  --white: #ffffff;
  --ink: rgba(255,255,255,0.5);
  --ink2: rgba(255,255,255,0.22);
}

html, body {
  min-height: 100vh;
  background: var(--bg);
  color: var(--white);
  font-family: Impact, 'Arial Narrow', Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}

body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    repeating-linear-gradient(45deg,  rgba(255,255,255,0.012) 0, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 10px),
    repeating-linear-gradient(-45deg, rgba(255,255,255,0.012) 0, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 10px);
  pointer-events: none;
}

/* ── HEADER ── */
.site-header {
  position: relative; z-index: 10;
  background: var(--bg2);
  border-bottom: 3px solid var(--red);
  padding: 0 20px;
  display: flex; align-items: center; justify-content: space-between;
  height: 52px;
}
.logo { font-size: 22px; font-weight: 900; letter-spacing: 0.15em; color: var(--white); }
.logo em { color: var(--red); font-style: normal; }
.live-pill {
  display: flex; align-items: center; gap: 6px;
  background: rgba(232,19,42,0.12); border: 1px solid rgba(232,19,42,0.3);
  border-radius: 20px; padding: 4px 12px;
  font-size: 9px; font-weight: 700; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--red);
}
.live-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--red);
  animation: pulse 1.5s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}
.live-pill.closed { background: rgba(255,255,255,0.04); border-color: var(--border); color: var(--ink2); }
.live-pill.closed .live-dot { background: var(--ink2); animation: none; }
.live-pill.scheduled { background: rgba(245,158,11,0.1); border-color: rgba(245,158,11,0.3); color: var(--amber); }
.live-pill.scheduled .live-dot { background: var(--amber); }

/* ── RACE INFO BAR ── */
.race-bar {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 12px 20px;
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px;
  position: relative; z-index: 5;
}
.race-name-big {
  font-size: 20px; font-weight: 900; letter-spacing: 0.04em;
  color: var(--white); line-height: 1;
}
.race-circuit { font-size: 10px; color: var(--ink); letter-spacing: 0.1em; margin-top: 3px; }

.race-timer { text-align: right; flex-shrink: 0; }
.timer-label { font-size: 8px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink2); margin-bottom: 3px; }
.timer-value { font-size: 20px; font-weight: 900; color: var(--gold); letter-spacing: 0.04em; line-height: 1; }

/* ── MAIN ── */
.main {
  max-width: 680px; margin: 0 auto;
  padding: 20px 16px 80px;
  position: relative; z-index: 5;
}

/* ── LEADERBOARD ROWS ── */
.lb-header {
  display: flex; align-items: center; gap: 10px;
  padding: 6px 14px; margin-bottom: 6px;
  font-size: 8px; font-weight: 700; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--ink2);
}
.lb-header-pos  { width: 32px; flex-shrink: 0; }
.lb-header-handle { flex: 1; }
.lb-header-time { min-width: 80px; text-align: right; }
.lb-header-correct { min-width: 44px; text-align: right; }
.lb-header-gap  { min-width: 64px; text-align: right; }

.lb-row {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px; border-radius: 8px;
  margin-bottom: 4px;
  background: var(--bg2);
  border: 1px solid transparent;
  transition: all 0.3s ease;
  position: relative; overflow: hidden;
}
.lb-row::before {
  content: '';
  position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px; border-radius: 3px 0 0 3px;
}
.lb-row.p1::before { background: var(--gold); }
.lb-row.p2::before { background: var(--silver); }
.lb-row.p3::before { background: var(--bronze); }
.lb-row.you { border-color: var(--gold2); background: rgba(245,200,66,0.04); }
.lb-row.moved-up   { animation: flashGreen 0.8s ease; }
.lb-row.moved-down { animation: flashRed 0.8s ease; }

@keyframes flashGreen {
  0%, 100% { background: var(--bg2); }
  50% { background: rgba(34,197,94,0.12); }
}
@keyframes flashRed {
  0%, 100% { background: var(--bg2); }
  50% { background: rgba(232,19,42,0.08); }
}

.lb-pos {
  font-size: 18px; font-weight: 900; width: 32px;
  flex-shrink: 0; text-align: center; color: var(--ink2);
}
.lb-pos.p1 { color: var(--gold); }
.lb-pos.p2 { color: var(--silver); }
.lb-pos.p3 { color: var(--bronze); }

.lb-pos-change {
  font-size: 9px; display: block; line-height: 1;
  margin-top: 2px; font-weight: 700;
}
.lb-pos-change.up   { color: var(--green); }
.lb-pos-change.down { color: var(--red); }
.lb-pos-change.same { color: transparent; }

.lb-handle {
  flex: 1; font-size: 15px; font-weight: 900;
  color: var(--white); letter-spacing: 0.03em;
}
.you-marker { font-size: 8px; color: var(--gold2); font-weight: 700; letter-spacing: 0.1em; margin-left: 6px; }

.lb-time {
  font-size: 16px; font-weight: 900; color: var(--white);
  min-width: 80px; text-align: right; letter-spacing: 0.04em;
}
.lb-row.p1 .lb-time { color: var(--gold); }

.lb-correct {
  font-size: 11px; color: var(--ink2); min-width: 44px;
  text-align: right; font-family: Arial, sans-serif;
}

.lb-gap {
  font-size: 11px; color: var(--ink2); min-width: 64px;
  text-align: right; font-family: Arial, sans-serif;
}

/* ── FASTEST LAP ── */
.fastest-bar {
  background: rgba(139,92,246,0.08);
  border: 1px solid rgba(139,92,246,0.25);
  border-radius: 8px; padding: 10px 14px;
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 16px;
}
.fl-label { font-size: 9px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(139,92,246,0.8); flex-shrink: 0; }
.fl-handle { flex: 1; font-size: 14px; font-weight: 900; color: var(--white); }
.fl-time { font-size: 13px; color: rgba(139,92,246,0.8); font-weight: 700; letter-spacing: 0.04em; }
.fl-bonus { font-size: 11px; font-weight: 900; color: rgba(139,92,246,0.8); flex-shrink: 0; }

/* ── STATS ROW ── */
.stats-row {
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  gap: 8px; margin-bottom: 16px;
}
.stat-mini {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 12px; text-align: center;
}
.stat-mini-n { font-size: 22px; font-weight: 900; color: var(--white); line-height: 1; }
.stat-mini-n.gold { color: var(--gold); }
.stat-mini-l { font-size: 8px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink2); margin-top: 3px; }

/* ── BOTTOM BAR ── */
.bottom-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--bg2); border-top: 1px solid var(--border);
  padding: 10px 20px;
  display: flex; align-items: center; justify-content: space-between;
  z-index: 50; gap: 10px;
}
.refresh-info { font-size: 10px; color: var(--ink2); font-family: Arial, sans-serif; }
.refresh-countdown { color: var(--gold2); font-weight: 700; }
.bottom-btns { display: flex; gap: 8px; }
.btn-bottom {
  border: none; border-radius: 6px; cursor: pointer;
  font-family: Impact, 'Arial Narrow', Arial, sans-serif;
  font-size: 11px; font-weight: 900; letter-spacing: 0.08em;
  text-transform: uppercase; padding: 7px 14px; transition: all 0.15s;
}
.btn-red { background: var(--red); color: white; }
.btn-red:hover { background: #ff1f38; }
.btn-ghost { background: var(--bg3); color: var(--ink); border: 1px solid var(--border); }
.btn-ghost:hover { border-color: var(--gold3); color: var(--gold2); }

/* ── EMPTY ── */
.empty-state {
  text-align: center; padding: 60px 24px;
  color: var(--ink2); font-family: Arial, sans-serif; font-size: 13px; line-height: 1.8;
}
.empty-icon { font-size: 48px; margin-bottom: 12px; display: block; }
</style>
</head>
<body>

<header class="site-header">
  <div class="logo">AP<em>EX</em></div>
  <div class="live-pill" id="live-pill">
    <div class="live-dot"></div>
    <span id="live-label">Live</span>
  </div>
</header>

<div class="race-bar">
  <div>
    <div class="race-name-big" id="race-name">Loading...</div>
    <div class="race-circuit" id="race-circuit">Fetching race information</div>
  </div>
  <div class="race-timer">
    <div class="timer-label" id="timer-label">Time remaining</div>
    <div class="timer-value" id="timer-value">—</div>
  </div>
</div>

<div class="main">

  <!-- STATS -->
  <div class="stats-row" id="stats-row">
    <div class="stat-mini"><div class="stat-mini-n gold" id="stat-entries">—</div><div class="stat-mini-l">Entries</div></div>
    <div class="stat-mini"><div class="stat-mini-n" id="stat-leader">—</div><div class="stat-mini-l">Leader</div></div>
    <div class="stat-mini"><div class="stat-mini-n" id="stat-fastest">—</div><div class="stat-mini-l">Fastest</div></div>
  </div>

  <!-- FASTEST LAP -->
  <div class="fastest-bar" id="fastest-bar" style="display:none;">
    <div class="fl-label">⚡ Fastest Lap</div>
    <div class="fl-handle" id="fl-handle">—</div>
    <div class="fl-time" id="fl-time">—</div>
    <div class="fl-bonus">+5 pts</div>
  </div>

  <!-- LEADERBOARD -->
  <div class="lb-header">
    <div class="lb-header-pos">Pos</div>
    <div class="lb-header-handle">Driver</div>
    <div class="lb-header-time">Time</div>
    <div class="lb-header-correct">Q</div>
    <div class="lb-header-gap">Gap</div>
  </div>

  <div id="lb-list">
    <div class="empty-state">
      <span class="empty-icon">🏁</span>
      Loading leaderboard...
    </div>
  </div>

</div>

<div class="bottom-bar">
  <div class="refresh-info">Updates every <span class="refresh-countdown" id="refresh-cd">30s</span></div>
  <div class="bottom-btns">
    <button class="btn-bottom btn-ghost" onclick="shareLeaderboard()">Share</button>
    <button class="btn-bottom btn-red" onclick="window.location.href='/apex/apex-welcome.html'">Race →</button>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://eluwjbndjlscixjytrzx.supabase.co';
const SUPABASE_KEY = 'sb_publishable_xOJRXt2dGCXovTNgDOSOJw_Shrbofuw';

let raceConfig = null;
let previousPositions = {};
let refreshTimer = 30;
let timerInterval = null;
const currentHandle = localStorage.getItem('apex_handle') || '';

// ── LOAD RACE CONFIG ──────────────────────────────────────────────────────────
async function loadRaceConfig() {
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/apex_races?order=open_time.desc&limit=1`,
      { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }}
    );
    const races = await res.json();
    if (!races.length) return null;
    return races[0];
  } catch(e) { return null; }
}

function getRaceStatus(race) {
  const now = new Date();
  const open  = new Date(race.open_time);
  const close = new Date(race.close_time);
  if (now < open)  return 'scheduled';
  if (now > close) return 'closed';
  return 'live';
}

function formatTime(secs) {
  if (!secs && secs !== 0) return '—';
  const m = Math.floor(secs / 60);
  const s = secs % 60;
  return String(m).padStart(2,'0') + ':' + s.toFixed(1).padStart(4,'0');
}

function formatCountdown(ms) {
  if (ms <= 0) return 'CLOSED';
  const h = Math.floor(ms / 3600000);
  const m = Math.floor((ms % 3600000) / 60000);
  const s = Math.floor((ms % 60000) / 1000);
  if (h > 0) return `${h}h ${String(m).padStart(2,'0')}m`;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

// ── UPDATE RACE BAR ───────────────────────────────────────────────────────────
function updateRaceBar(race) {
  const status = getRaceStatus(race);
  const pill = document.getElementById('live-pill');
  const label = document.getElementById('live-label');
  const timerLabel = document.getElementById('timer-label');
  const timerVal   = document.getElementById('timer-value');

  document.getElementById('race-name').textContent    = race.race_name;
  document.getElementById('race-circuit').textContent = `${race.circuit} · ${race.season}`;

  document.title = `APEX · ${race.race_name} · Live Leaderboard`;

  if (status === 'live') {
    pill.className = 'live-pill';
    label.textContent = 'LIVE';
    timerLabel.textContent = 'Race closes in';
    // Start countdown
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      const ms = new Date(race.close_time) - new Date();
      timerVal.textContent = formatCountdown(ms);
      if (ms <= 0) { clearInterval(timerInterval); timerVal.textContent = 'CLOSED'; }
    }, 1000);
    timerVal.textContent = formatCountdown(new Date(race.close_time) - new Date());
  } else if (status === 'scheduled') {
    pill.className = 'live-pill scheduled';
    label.textContent = 'UPCOMING';
    timerLabel.textContent = 'Race opens in';
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      const ms = new Date(race.open_time) - new Date();
      timerVal.textContent = formatCountdown(ms);
      if (ms <= 0) clearInterval(timerInterval);
    }, 1000);
    timerVal.textContent = formatCountdown(new Date(race.open_time) - new Date());
  } else {
    pill.className = 'live-pill closed';
    label.textContent = 'CLOSED';
    timerLabel.textContent = 'Race ended';
    timerVal.textContent = new Date(race.close_time).toLocaleDateString('en-GB', { day:'numeric', month:'short' });
  }
}

// ── LOAD LEADERBOARD ──────────────────────────────────────────────────────────
async function loadLeaderboard() {
  if (!raceConfig) return;

  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/apex_scores?race=eq.${encodeURIComponent(raceConfig.race_name)}&order=total_time.asc&limit=500`,
      { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }}
    );
    const all = await res.json();

    // Best time per handle
    const best = {};
    all.forEach(r => {
      if (!best[r.handle] || r.total_time < best[r.handle].total_time) best[r.handle] = r;
    });
    const lb = Object.values(best).sort((a,b) => a.total_time - b.total_time);

    renderLeaderboard(lb);
    updateStats(lb);

  } catch(e) {}
}

function renderLeaderboard(lb) {
  const el = document.getElementById('lb-list');

  if (!lb.length) {
    el.innerHTML = `<div class="empty-state">
      <span class="empty-icon">🏎</span>
      No times posted yet.<br>Be the first on the grid.
    </div>`;
    document.getElementById('fastest-bar').style.display = 'none';
    return;
  }

  const leader = lb[0];

  // Show fastest lap bar
  const flBar = document.getElementById('fastest-bar');
  flBar.style.display = 'flex';
  document.getElementById('fl-handle').textContent = leader.handle;
  document.getElementById('fl-time').textContent   = formatTime(leader.total_time);

  // Render rows with position change indicators
  el.innerHTML = lb.map((row, i) => {
    const pos = i + 1;
    const isYou = row.handle === currentHandle;
    const prev = previousPositions[row.handle];
    let changeClass = '', changeSymbol = '';

    if (prev !== undefined && prev !== pos) {
      if (pos < prev)  { changeClass = 'up';   changeSymbol = `▲${prev - pos}`; }
      if (pos > prev)  { changeClass = 'down'; changeSymbol = `▼${pos - prev}`; }
    }

    const posClass = pos === 1 ? 'p1' : pos === 2 ? 'p2' : pos === 3 ? 'p3' : '';
    const gap = pos === 1 ? '' : '+' + formatTime(row.total_time - leader.total_time);
    const correct = row.correct !== undefined ? row.correct + '/25' : '—';

    return `<div class="lb-row ${posClass} ${isYou ? 'you' : ''} ${changeClass ? 'moved-' + (changeClass === 'up' ? 'up' : 'down') : ''}">
      <div class="lb-pos ${posClass}">
        ${pos}
        <span class="lb-pos-change ${changeClass || 'same'}">${changeSymbol || '·'}</span>
      </div>
      <div class="lb-handle">
        ${row.handle}
        ${isYou ? '<span class="you-marker">YOU</span>' : ''}
      </div>
      <div class="lb-time">${formatTime(row.total_time)}</div>
      <div class="lb-correct">${correct}</div>
      <div class="lb-gap">${gap}</div>
    </div>`;
  }).join('');

  // Update previous positions for next refresh
  lb.forEach((row, i) => { previousPositions[row.handle] = i + 1; });
}

function updateStats(lb) {
  document.getElementById('stat-entries').textContent = lb.length;
  document.getElementById('stat-leader').textContent  = lb.length ? lb[0].handle.replace('@','') : '—';
  document.getElementById('stat-fastest').textContent = lb.length ? formatTime(lb[0].total_time) : '—';
}

// ── SHARE ─────────────────────────────────────────────────────────────────────
function shareLeaderboard() {
  const raceName = raceConfig ? raceConfig.race_name : 'APEX Race';
  const rows = document.querySelectorAll('.lb-row');
  let text = `APEX · ${raceName} · Live Leaderboard 🏁\n\n`;
  let count = 0;
  rows.forEach(row => {
    if (count >= 5) return;
    const pos = row.querySelector('.lb-pos').childNodes[0].textContent.trim();
    const handle = row.querySelector('.lb-handle').childNodes[0].textContent.trim();
    const time = row.querySelector('.lb-time').textContent.trim();
    text += `P${pos} ${handle} · ${time}\n`;
    count++;
  });
  const status = raceConfig ? getRaceStatus(raceConfig) : '';
  text += status === 'live' ? '\nRace still open — can you beat them?\n' : '\n';
  text += 'carcophony.github.io/apex/apex-leaderboard.html';
  window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(text), '_blank');
}

// ── AUTO REFRESH ──────────────────────────────────────────────────────────────
function startRefresh() {
  refreshTimer = 30;
  const el = document.getElementById('refresh-cd');
  const interval = setInterval(() => {
    refreshTimer--;
    el.textContent = refreshTimer + 's';
    if (refreshTimer <= 0) {
      clearInterval(interval);
      el.textContent = '...';
      loadLeaderboard().then(() => startRefresh());
    }
  }, 1000);
}

// ── INIT ──────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', async () => {
  raceConfig = await loadRaceConfig();
  if (raceConfig) {
    updateRaceBar(raceConfig);
    await loadLeaderboard();
    startRefresh();
  } else {
    document.getElementById('race-name').textContent    = 'No race scheduled';
    document.getElementById('race-circuit').textContent = 'Check back soon';
    document.getElementById('lb-list').innerHTML = `<div class="empty-state">
      <span class="empty-icon">⏳</span>
      No race currently scheduled.<br>Follow @only9built for announcements.
    </div>`;
  }
});
</script>
</body>
</html>
